name: app-build

# Builds the API browser on every change to it. This is a build, not a deploy:
# the published site is still the page at the repository root, and swapping it
# for this app is a separate decision.
#
# It is also the only way to prove that the Keel package grant works. Keel is a
# private package owned by the keel repository, so a workflow here can only
# restore it because powerplatform-apis has been granted access to the package
# under Manage Actions access. There is no API for that grant on a user-owned
# package, so a green run is the check.

on:
  push:
    paths:
      - 'app/**'
      - 'nuget.config'
      - '.github/workflows/app-build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'nuget.config'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Authenticate the keel feed
        # The run's own GITHUB_TOKEN, no PAT. It carries packages:read from the
        # permissions block above, and the package grants this repository access.
        run: >
          dotnet nuget update source keel
          --username AdamCoulterOz
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text

      - name: Restore
        run: dotnet restore app/Browser

      - name: Publish
        run: dotnet publish app/Browser -c Release -o app/dist --no-restore

      - name: Point the loader at the fingerprinted runtime
        run: python3 app/fingerprint-importmap.py app/dist/wwwroot

      - name: Report the payload
        # What a browser actually downloads is the brotli total, not the folder.
        run: |
          echo "brotli   $(find app/dist/wwwroot -name '*.br' -exec cat {} + | wc -c | awk '{printf "%.1f MB", $1/1048576}')"
          echo "raw wasm $(find app/dist/wwwroot/_framework -name '*.wasm' -exec cat {} + | wc -c | awk '{printf "%.1f MB", $1/1048576}')"

      - name: Check the published output
        # A Blazor publish can succeed while producing a site that cannot boot,
        # so assert the pieces the app actually needs at runtime.
        run: |
          set -e
          for f in app/dist/wwwroot/index.html \
                   app/dist/wwwroot/_framework/blazor.webassembly.js; do
            [ -f "$f" ] || { echo "missing: $f"; exit 1; }
          done
          runtime=$(grep -oE '_framework/dotnet\.[a-z0-9]+\.js' app/dist/wwwroot/index.html | tail -1)
          [ -n "$runtime" ] && [ -f "app/dist/wwwroot/$runtime" ] \
            || { echo 'the loader is not mapped to a deployed runtime'; exit 1; }
          ls app/dist/wwwroot/_framework/ | grep -q '^Keel\..*\.wasm$' \
            || { echo 'Keel assembly missing'; exit 1; }
          echo "published $(find app/dist/wwwroot/_framework -name '*.wasm' | wc -l) assemblies"

      - uses: actions/upload-artifact@v4
        with:
          name: api-browser
          path: app/dist/wwwroot
          retention-days: 7

  # AOT trades download size for execution speed, and for a documentation
  # browser those pull in opposite directions: the payload is what a reader
  # waits for, while the CPU work (parsing a spec once, rendering a schema
  # tree) is already fast. So it is measured on demand rather than assumed,
  # and left off the default build, which also keeps that build quick.
  aot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Authenticate the keel feed
        run: >
          dotnet nuget update source keel
          --username AdamCoulterOz
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text

      - name: Publish with AOT
        run: >
          dotnet publish app/Browser -c Release -o app/aot
          -p:RunAOTCompilation=true

      - name: Report the payload
        run: |
          echo "AOT brotli   $(find app/aot/wwwroot -name '*.br' -exec cat {} + | wc -c | awk '{printf "%.1f MB", $1/1048576}')"
          echo "AOT raw wasm $(find app/aot/wwwroot/_framework -name '*.wasm' -exec cat {} + | wc -c | awk '{printf "%.1f MB", $1/1048576}')"
          echo "compare against the build job, which is the same app without AOT"
