name: pages

# Publishes the corpus: the specs, the catalogue, the deep-link index and the
# documentation mirrors, plus a redirect at the root that sends a reader to the
# OpenAPI browser with this catalogue selected.
#
# The browser itself is no longer built here. It lives in AdamCoulterOz/oas-browser
# and is deployed from that repository, so this workflow no longer needs .NET, the
# keel package feed, or an asset-fingerprinting step. What it must keep doing is
# serving every file the browser fetches cross-origin -- specs.json, index.json and
# each spec -- with the CORS header GitHub Pages sets by default. If that ever
# stops, the browser fails to load this corpus and does so silently.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'specs.json'
      - 'index.json'
      - '*/oas/**'
      - '*/docs/**'
      - '*/catalogue/**'
      - '*/README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          set -e
          mkdir -p _site
          cp index.html specs.json _site/
          [ -f index.json ] && cp index.json _site/
          for api in $(python3 -c "
          import json
          raw = json.load(open('specs.json'))
          entries = raw['specs'] if isinstance(raw, dict) else raw
          print(' '.join(e['url'].split('/')[0] for e in entries))"); do
            [ -d "$api" ] || { echo "specs.json names $api, which is not in the repository"; exit 1; }
            mkdir -p "_site/$api"
            for part in oas docs catalogue evidence README.md; do
              [ -e "$api/$part" ] && cp -R "$api/$part" "_site/$api/"
            done
          done
          touch _site/.nojekyll

      - name: Check the site serves what the browser will ask for
        # The browser fetches this corpus from another origin, so a spec named in
        # specs.json but missing from the artifact shows up as an empty picker
        # over there rather than as a failure here.
        run: |
          set -e
          for f in _site/index.html _site/specs.json; do
            [ -f "$f" ] || { echo "missing: $f"; exit 1; }
          done
          python3 - <<'PY'
          import json, pathlib, sys
          raw = json.load(open('specs.json'))
          entries = raw['specs'] if isinstance(raw, dict) else raw
          missing = [e['url'] for e in entries
                     if not pathlib.Path('_site', e['url']).is_file()]
          if isinstance(raw, dict) and raw.get('index') and not pathlib.Path('_site', raw['index']).is_file():
              missing.append(raw['index'])
          if missing:
              sys.exit('listed but not deployed: ' + ', '.join(missing))
          print(f'all {len(entries)} specs and the index are present')
          PY
          # The redirect is the only thing a reader arriving at the root will see,
          # so a redirect that does not name the browser is a dead landing page.
          grep -q 'oas-browser' _site/index.html \
            || { echo 'index.html does not point at the browser'; exit 1; }
          grep -q 'location.hash' _site/index.html \
            || { echo 'index.html drops the fragment, so deep links would not survive'; exit 1; }
          echo "site assembled: $(du -sh _site | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
