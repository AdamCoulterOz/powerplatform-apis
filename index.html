<title>Power Platform APIs</title>

<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
         margin: 0; min-height: 100vh; display: grid; place-items: center;
         padding: 2rem; text-align: center; }
  main { max-width: 34rem; }
  code { font-size: .9em; overflow-wrap: anywhere; }
  a { color: inherit; }
</style>
<script>
  // The corpus lives here; the viewer lives in its own repository. Send the
  // reader to the viewer with this catalogue selected, preserving any fragment
  // so an existing deep link survives the hop -- the whole point of redirecting
  // rather than just linking.
  (function () {
    var target = "https://adamcoulteroz.github.io/oas-browser/?catalogue=" +
      encodeURIComponent("https://adamcoulteroz.github.io/powerplatform-apis/specs.json");
    location.replace(target + location.hash);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://adamcoulteroz.github.io/oas-browser/?catalogue=https%3A%2F%2Fadamcoulteroz.github.io%2Fpowerplatform-apis%2Fspecs.json"></noscript>
</head>

<main>
  <h1>Power Platform APIs</h1>

  <p>The specifications themselves stay here and are readable without it:
     <a href="specs.json"><code>specs.json</code></a>,
     and each spec at <code>&lt;api&gt;/oas/openapi.json</code>.</p>
</main>
</body>
